name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get install -y tmux
      - run: uv sync
      - run: uv run pytest
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: brew install tmux
      - run: uv sync
      - run: uv run pytest
      - run: swift build && swift test
        working-directory: widget
