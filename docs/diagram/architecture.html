<title id="architecture-title">How TabDeck fits together</title>
<desc id="architecture-desc">TabDeck architecture: on the Mac, the widget and the Mac agent talk to an always-on server (the hub), which runs the coding-agent sessions in tmux; iTerm2 shows those sessions as tabs over ssh, a paired phone uses the hub's web app, and the hub can use optional model, speech-to-text and voice services, which one ODS server can provide.</desc>
